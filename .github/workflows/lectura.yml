# =====================================================================
# Lectura de noticias cada hora, en los servidores de GitHub
# ---------------------------------------------------------------------
# Qué hace, en palabras simples:
#   Cada hora (y cuando se aprieta «Run workflow» en la pestaña Actions)
#   GitHub enciende una computadora en la nube, lee las noticias, compara
#   las cifras con las oficiales, arma las conclusiones y publica la página
#   en GitHub Pages. No usa la computadora de nadie del equipo.
#
#   Las fichas no se guardan en el repositorio (cada lectura las arma de
#   cero), así el repositorio no crece. Solo se guarda una vez al día
#   estado.json, un resumen de pocas líneas: sirve para que GitHub vea
#   actividad y no pause el reloj (lo hace tras 60 días sin cambios).
# =====================================================================
name: Lectura de noticias

on:
  schedule:
    - cron: '41 * * * *'     # minuto 41 de cada hora (hora UTC; GitHub puede atrasarse unos minutos)
  workflow_dispatch:          # botón «Run workflow» para correrlo a mano
  push:                       # cuando se sube un cambio (reglas, cifras oficiales, página)
    branches: [main]
    paths-ignore: ['estado.json', '**.md']

permissions:
  contents: write             # para guardar estado.json
  pages: write                # para publicar la página
  id-token: write
  actions: write              # para volver a encender el reloj de respaldo si se cortó
  issues: write               # para abrir (y cerrar) el aviso «Alerta de la lectura»

concurrency:
  group: lectura
  cancel-in-progress: false

jobs:
  lectura:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Preparar (hora de inicio y pdftotext)
        run: |
          echo "INICIO_LECTURA=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: Pruebas antes de publicar
        # Si una regla nueva rompe un caso ya corregido o la lectura de un PDF verificado,
        # la lectura se detiene aquí y la página sigue mostrando la versión anterior.
        run: node pruebas/correr.mjs

      - name: Leer noticias
        run: node lector.mjs

      - name: Comparar cifras con las oficiales
        run: node evaluar.mjs

      - name: Armar conclusiones para la emergencia
        run: node conclusiones.mjs

      - name: Leer los reportes del INDECI (personas afectadas)
        # Si el portal del INDECI no responde, la página se publica igual con las noticias.
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # El DNS del INDECI solo responde a consultas desde el Perú. Desde fuera, el nombre se
          # resuelve por su cortafuegos (FortiWeb Cloud, el mismo destino que ven los usuarios en el Perú).
          # Autorizado por el dueño del proyecto el 09/11/2026.
          if ! getent hosts portal.indeci.gob.pe >/dev/null; then
            IP=$(getent ahostsv4 portal.indeci.gob.pe.P8853039083.fortiwebcloud.net | awk 'NR==1{print $1}')
            [ -n "$IP" ] && echo "$IP portal.indeci.gob.pe" | sudo tee -a /etc/hosts && echo "Portal del INDECI por su cortafuegos: $IP"
          fi
          # Memoria de los reportes ya leídos (se guarda en la rama «datos»)
          git fetch -q --depth 1 origin datos && git show origin/datos:indeci-cache.json > indeci-cache.tmp && mv indeci-cache.tmp indeci-cache.json || echo "Sin memoria previa: se leerá desde el inicio."
          # Datos de la lectura anterior, por si el portal no responde esta vez
          git show origin/datos:afectados.json > afectados.tmp 2>/dev/null && mv afectados.tmp afectados.json || true
          set -o pipefail
          node afectados.mjs 2>&1 | tee indeci.log

      - name: Control de salud (si algo salió mal, se publica la versión anterior)
        run: |
          mkdir -p prev
          git fetch -q --depth 1 origin datos 2>/dev/null || true
          for f in fichas.json conclusiones.json afectados.json salud.json; do git show origin/datos:$f > prev/$f 2>/dev/null || rm -f prev/$f; done
          node salud.mjs prev

      - name: Preparar la página
        run: |
          mkdir -p _site
          cp index.html fichas.json conclusiones.json salud.json _site/
          [ -f afectados.json ] && cp afectados.json _site/ || echo "Sin afectados.json en esta lectura."
          cp conclusiones.md evaluacion.md _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Dejar los datos en la rama «datos» (para el agente diario de Claude)
        # Se reemplaza completa en cada lectura (un solo cambio, sin historial), así no crece.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(mktemp -d)
          cp fichas.json conclusiones.json conclusiones.md evaluacion.json evaluacion.md "$D"/
          cp afectados.json indeci-cache.json "$D"/ 2>/dev/null || true
          cp salud.json "$D"/ 2>/dev/null || true
          cd "$D"
          git init -q -b datos
          git add .
          git -c user.name="lector-noticias" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Datos de la lectura del $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos || echo "No se pudo actualizar la rama datos (la página se publica igual)."

      - name: Avisar por GitHub si la lectura tiene alertas
        # Abre un solo aviso (issue) mientras dure el problema y lo cierra cuando todo vuelve a estar bien.
        # GitHub manda un correo al dueño del repositorio cuando se abre.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ESTADO=$(node -p "require('./salud.json').estado")
          N=$(gh issue list --state open --search "Alerta de la lectura in:title" --json number --jq '.[0].number // empty')
          if [ "$ESTADO" = "alerta" ] && [ -z "$N" ]; then
            { echo "El control de salud de la lectura del $(node -p "require('./salud.json').generado") (UTC) encontró:"; echo
              node -p "require('./salud.json').alertas.map(a => '- ' + a).join(String.fromCharCode(10))"; echo
              echo "La página sigue mostrando los datos anteriores buenos. Este aviso se cierra solo cuando una lectura vuelve a salir bien."; } > aviso.md
            gh issue create --title "Alerta de la lectura de noticias" --body-file aviso.md
          elif [ "$ESTADO" = "bien" ] && [ -n "$N" ]; then
            gh issue close "$N" --comment "La lectura del $(date -u +%Y-%m-%dT%H:%MZ) salió bien: se cierra el aviso."
          else
            echo "Estado: $ESTADO; aviso abierto: ${N:-ninguno}."
          fi

      - name: Guardar el resumen del día (estado.json)
        run: |
          ANTES=$(git show HEAD:estado.json 2>/dev/null | node -e "let t='';process.stdin.on('data',d=>t+=d).on('end',()=>{try{console.log(JSON.parse(t).dia)}catch{console.log('')}})")
          node resumen-dia.mjs
          AHORA=$(node -p "require('./estado.json').dia")
          if [ "$ANTES" = "$AHORA" ]; then
            echo "El resumen de hoy ($AHORA) ya está guardado."
          else
            git config user.name "lector-noticias"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json
            git commit -m "Resumen de la lectura del $AHORA"
            git push || echo "No se pudo guardar estado.json (la página se publica igual)."
          fi

  # Vigilante del reloj de respaldo: si GitHub no logró arrancar el reloj (pasó el 09/11/2026,
  # cuando un cambio subido lanzó un reloj nuevo que falló antes de empezar y canceló al que
  # esperaba), la cadena horaria se corta. Cada lectura revisa que haya un reloj esperando y,
  # si no hay ninguno, lo vuelve a encender.
  vigilar-reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Encender el reloj de respaldo si no hay uno esperando
        run: |
          ACTIVOS=$(gh run list --workflow reloj.yml --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "${ACTIVOS:-0}" -gt 0 ]; then
            echo "El reloj de respaldo está esperando ($ACTIVOS en curso)."
          else
            gh workflow run reloj.yml --ref main
            echo "No había reloj esperando: lo encendí de nuevo."
          fi

  publicar:
    needs: lectura
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
