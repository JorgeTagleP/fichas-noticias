# =====================================================================
# Respaldo semanal del repositorio y de la página
# ---------------------------------------------------------------------
# Cada domingo a las 08:00 de Lima (13:00 UTC), y cuando se aprieta
# «Run workflow», GitHub guarda una copia completa como «Release» del
# repositorio (pestaña Releases):
#   • fichas-noticias-AAAA-MM-DD.bundle: todo el repositorio, con su
#     historial y las ramas main y datos (incluye la memoria del INDECI).
#     Se restaura con:  git clone fichas-noticias-AAAA-MM-DD.bundle fichas-noticias
#                       cd fichas-noticias && git branch datos origin/datos
#   • pagina-AAAA-MM-DD.zip: la página tal como estaba publicada, con sus datos.
# Se conservan las últimas 8 semanas; las más antiguas se borran solas.
# No guarda contraseñas ni la configuración de GitHub Pages.
# =====================================================================
name: Respaldo semanal

on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:

permissions:
  contents: write             # para crear y borrar los Releases de respaldo

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Copiar el repositorio completo
        run: |
          git clone -q --bare "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo.git
          echo "Ramas: $(git -C repo.git branch --format='%(refname:short)' | tr '\n' ' ')"

      - name: Armar el respaldo
        run: |
          DIA=$(TZ=America/Lima date +%Y-%m-%d)
          echo "DIA=$DIA" >> "$GITHUB_ENV"
          git -C repo.git bundle create "../fichas-noticias-$DIA.bundle" --all
          git -C repo.git bundle verify "../fichas-noticias-$DIA.bundle"
          # Prueba de restauración: el respaldo debe traer las dos ramas.
          git clone -q "fichas-noticias-$DIA.bundle" prueba
          git -C prueba rev-parse --verify -q origin/main >/dev/null
          git -C prueba rev-parse --verify -q origin/datos >/dev/null && echo "Restauración probada: main y datos."
          # La página tal como está publicada (index.html de main + datos de la última lectura).
          mkdir -p pagina
          git -C repo.git show main:index.html > pagina/index.html
          for f in fichas.json conclusiones.json afectados.json salud.json conclusiones.md evaluacion.md; do
            git -C repo.git show datos:$f > pagina/$f 2>/dev/null || rm -f pagina/$f
          done
          (cd pagina && zip -q -r "../pagina-$DIA.zip" .)
          ls -l "fichas-noticias-$DIA.bundle" "pagina-$DIA.zip"

      - name: Guardar como Release
        run: |
          TAG="respaldo-$DIA"
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" "fichas-noticias-$DIA.bundle" "pagina-$DIA.zip" \
            --title "Respaldo del $DIA" --latest=false \
            --notes "Respaldo semanal automático. El .bundle trae todo el repositorio (ramas main y datos); el .zip, la página publicada con sus datos. Cómo restaurar: ver .github/workflows/respaldo.yml."

      - name: Conservar solo las últimas 8 semanas
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^respaldo-' | sort -r | tail -n +9 | while read -r t; do
            gh release delete "$t" --cleanup-tag --yes && echo "Borrado el respaldo antiguo $t"
          done
